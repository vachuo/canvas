<span style="align-self: flex-start; font-family: Inter, system-ui, sans-serif; font-size: 12.5px; font-weight: 600; padding: 4px 12px; border-radius: 999px; background: #DDF4F1; color: #115E59">Value of a degree</span>
<h1 style="margin: 0; font-size: clamp(38px, 4.6vw, 58px); line-height: 1.04; letter-spacing: -0.015em; font-weight: 600; color: #14161A; text-wrap: balance">The Paper Chase: What a Diploma, Degree, Master’s and PhD Are Really Worth in Kenya and America</h1>
<p style="margin: 0; font-size: 23px; line-height: 1.45; font-style: italic; color: #3F444C">Every family has the stories. The graduate selling secondhand clothes with a degree certificate in a drawer. The uncle who says “get your papers first”. The barista with a master’s, the plumber who out-earns the professor, the PhD who drives a taxi. Each stereotype holds a grain of truth. This is our attempt to weigh the grain, credential by credential, in Kenya and in America.</p>
<p style="margin: 0; padding-bottom: 18px; border-bottom: 1px solid #E2E2DA; font-family: Inter, system-ui, sans-serif; font-size: 14px; color: #62676F">Vachuo Research · 11 min read</p>
<figure aria-hidden="true" style="margin: 4px 0; position: relative; height: clamp(240px, 34vw, 320px); border-radius: 22px; overflow: hidden; background: #0D9488">

<div class="ixs" data-ixgo="stat" role="list" aria-label="At a glance"><template data-for="{{stItems}}" data-as="s"><div role="listitem" class="ixst" style="opacity: {{s.op}}; transform: {{s.tf}}; transition-delay: {{s.dl}}"><span class="ixsr">{{s.fin}}</span><span aria-hidden="true" class="ixsn">{{s.v}}</span><span class="ixsl">{{s.l}}</span></div></template></div>

<h2 style="margin: 18px 0 0; font-size: 31px; line-height: 1.15; font-weight: 600; color: #14161A">Our view, up front</h2>
<p style="margin: 0">A credential is worth what the labour market around it will pay, and Kenya and America have very different labour markets. In America a bachelor’s degree is still one of the best bets a young person can make, but its price keeps rising and the first years after graduation have become harder. In Kenya a degree is a ticket to a queue for a small number of formal jobs, and what you do while you wait matters as much as the certificate. Above the bachelor’s, in both countries, the case for more paper depends almost entirely on the field, and on who pays.</p>
<p style="margin: 0; padding: 14px 16px; border-radius: 14px; background: #F4F4EF; font-family: Inter, system-ui, sans-serif; font-size: 15px; line-height: 1.55; color: #3F444C">This is an opinion piece. The figures are the latest we could find. Kenya publishes far less than the United States on pay by qualification, so the Kenyan comparisons lean on public-service entry grades, enrolment and tracer studies.</p>
<figure class="ix" aria-label="Four credentials, two countries"><h3>Interactive · Four credentials, two countries</h3><p class="lede">Filter by country, search, or tap a heading to sort.</p><div class="ixtabs" role="group" aria-label="Filter by country"><template data-for="{{dvF}}" data-as="f"><button type="button" class="ixb" aria-pressed="{{f.on}}" onClick="{{f.go}}">{{f.l}}</button></template></div><input type="search" class="ixq" placeholder="Search the table" aria-label="Search the table" value="{{dvQ}}" onInput="{{dvSetQ}}"><p class="ixnote" role="status" aria-live="polite">{{dvCount}}</p><div class="ixtw" tabindex="0" role="region" aria-label="Four credentials, two countries, table"><div class="ixtb" role="table" aria-label="Four credentials, two countries" style="--cols: minmax(130px, 1fr) minmax(100px, 0.8fr) minmax(110px, 0.9fr) minmax(170px, 1.4fr) minmax(170px, 1.4fr) minmax(190px, 1.5fr); --minw: 920px"><div class="ixtr ixth" role="row"><template data-for="{{dvH}}" data-as="h"><div role="columnheader" aria-sort="{{h.sort}}"><button type="button" onClick="{{h.go}}">{{h.l}}<span aria-hidden="true">{{h.ar}}</span></button></div></template></div><template data-for="{{dvR}}" data-as="r"><div class="ixtr" role="row"><template data-for="{{r.c}}" data-as="c"><div role="cell" class="{{c.cls}}">{{c.t}}</div></template></div></template></div></div><template data-if="{{dvMore}}"><button type="button" class="ixb" onClick="{{dvMoreGo}}" style="align-self: flex-start">{{dvMoreL}}</button></template><template data-if="{{dvHasNote}}"><p class="ixnote">{{dvNote}}</p></template></figure>
<h2 style="margin: 18px 0 0; font-size: 31px; line-height: 1.15; font-weight: 600; color: #14161A">Diploma: the underrated workhorse</h2>
<p style="margin: 0"><b>The stereotype.</b> In Kenya, a diploma is what you do when KCSE goes badly. In America, you skip college altogether and become a six-figure plumber.</p>
<p style="margin: 0"><b>The reality.</b> Of the 993,226 candidates who sat KCSE in 2025, about 270,000 scored the C+ needed for direct university entry. Most of the rest are not failures; they are the majority. TVET enrolment rose from about 350,000 in 2022 to 1.2 million by May 2026, more than the number of university students. In a World Bank project with 16 flagship institutes in Kenya, Tanzania and Ethiopia, the share of TVET graduates in work within six months rose from 47% to 80% once colleges built courses with employers. The gap that remains is in formal pay: in the civil service, a diploma holder starts at grade C3 and a graduate at C5. In America, associate degree holders earned $1,135 a week in 2025, 17% more than high school graduates but far below bachelor’s graduates. Some trades pay well, but six-figure trade salaries are the exception, not the rule.</p>
<p style="margin: 0"><b>Our verdict.</b> In Kenya, a good diploma in a trade employers need is one of the best-value credentials there is, and the stigma is out of date. In America, the associate degree pays best as a stepping stone to a bachelor’s, or in health and technical fields.</p>
<h2 style="margin: 18px 0 0; font-size: 31px; line-height: 1.15; font-weight: 600; color: #14161A">Bachelor’s: still worth it, but no longer a promise</h2>
<p style="margin: 0"><b>The stereotype.</b> In Kenya, a degree guarantees a good job, or, in the cynical version, guarantees five years of unemployment. In America, college no longer pays.</p>
<p style="margin: 0"><b>The reality in Kenya.</b> About 670,000 students are at university, and the government funds far more of them than before: HELB supported 823,691 students in 2025-26, against 339,347 in 2022-23, under a funding model that has spent two years in and out of court. The jobs have not kept up. Of the 822,100 new jobs recorded in 2025, nearly nine in ten were informal. A 2026 study by the Commission for University Education found that graduates take 11.6 months, on average, to find a first job: a quarter within six months, four in ten after more than a year. That is grim, but it is not five years.</p>
<p style="margin: 0"><b>The reality in America.</b> Bachelor’s graduates earned $1,578 a week in 2025, 63% more than high school graduates, with lower unemployment (2.8% against 4.3%). The average federal borrower owes about $40,800, and the share of Americans with high confidence in higher education fell to 38% in 2026. Yet 71% of graduates say their degree was worth the cost. The cracks are at the start: 5.2% of recent graduates were unemployed in late 2026 and 42.5% were working in jobs that don’t need a degree.</p>
<p style="margin: 0"><b>Our verdict.</b> Worth it in both countries. In Kenya, treat the degree as the entry ticket, not the job, and build proof of what you can do alongside it. In America, the degree is insurance whose premium keeps rising: choose the field and the price as carefully as the college.</p>

<h2 style="margin: 18px 0 0; font-size: 31px; line-height: 1.15; font-weight: 600; color: #14161A">Master’s: the most oversold credential</h2>
<p style="margin: 0"><b>The stereotype.</b> A master’s gets you noticed; in a bad job market, graduate school is the safe move.</p>
<p style="margin: 0"><b>The reality.</b> In America, master’s graduates earned 19% more than bachelor’s graduates in 2025, but averages hide the spread. By the Foundation for Research on Equal Opportunity’s estimate, about 40% of master’s programmes leave students worse off financially. More than 60% of MBAs and other business master’s degrees show no positive return, and arts and humanities master’s degrees have a median return of about minus $400,000. Computer science, engineering and nursing almost never fail to pay. In Kenya, master’s degrees are often taken part time and paid for privately, and they are often expected for promotion and for teaching at university; Kenya’s business press describes a surplus of MBA holders struggling to find work that uses the degree.</p>
<p style="margin: 0"><b>Our verdict.</b> Do a master’s for a specific job or pay rise you can name, or because an employer is paying. Don’t do one to wait out a bad year: you may finish with the same job market and more debt.</p>

<h2 style="margin: 18px 0 0; font-size: 31px; line-height: 1.15; font-weight: 600; color: #14161A">PhD: a calling, not a career plan</h2>
<p style="margin: 0"><b>The stereotype.</b> “Doctor” means a job for life. Or, the cynical version, PhDs end up driving taxis.</p>
<p style="margin: 0"><b>The reality in America.</b> Doctoral degree holders earned $2,307 a week in 2025 and had the lowest unemployment of any group, 1.8%. But the path is long: of the 58,131 doctorates awarded in 2024, those with a job lined up were often heading to temporary postdoc posts (39%), and industry commitments have fallen since 2022. By FREOPP’s estimate, most PhDs outside science and engineering do not pay back in money, and even in science about a third do not.</p>
<p style="margin: 0"><b>The reality in Kenya.</b> Kenya produces a few hundred PhDs a year, short of its target of 1,000, and fewer than 10,000 people in Kenya hold a doctorate. Some universities lack the PhD-qualified staff the rules expect, while PhD holders teach part time for as little as KSh 7,000 a course. That is not a surplus of PhDs. It is a shortage of posts that pay them.</p>
<p style="margin: 0"><b>Our verdict.</b> Do a PhD for the question, not the title, and get it funded if you can. Kenya needs more doctors of philosophy, and universities that can afford to employ them.</p>

<p style="margin: 0">We are not against degrees. We are against treating the certificate as the whole story. Vachuo keeps a Portfolio of what a learner has made and shown, in words, from the first years of school, so that by the time a degree, a diploma or a doctorate is on the table, there is already evidence of what that person can do, and a better sense of which credential is worth the years.</p>
